name: Supabase keepalive

# Supabase pauses free-tier projects after 7 days with no activity.
# This hits the REST API a couple of times a week so the project stays awake.
on:
  schedule:
    # 06:17 UTC every Monday and Thursday (odd minute so we avoid the
    # top-of-hour rush, when GitHub delays scheduled jobs the most).
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 60 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/camps?select=id&limit=1")
          echo "HTTP $code"
          head -c 500 /tmp/body; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase keepalive query failed with HTTP $code"
            exit 1
          fi

      # GitHub disables scheduled workflows in a repo with no commit activity
      # for 60 days, which would silently kill the keepalive. Push a dated
      # marker commit if the repo has been quiet for a while.
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep scheduled workflows enabled
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age day(s) ago."
          if [ "$age" -lt 45 ]; then
            echo "Repo is active; nothing to do."
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "chore: keepalive marker (keeps scheduled workflows enabled)"
          git push
