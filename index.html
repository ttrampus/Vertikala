<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AK Vertikala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Open the Supabase connection while JS is still loading — every page's
         first data/image request skips the DNS+TLS handshake. Same for the
         Unsplash hero, which is the homepage's largest paint. -->
    <link rel="preconnect" href="https://wkzgrvrvhmygfaobsbvb.supabase.co" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600&q=80" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
